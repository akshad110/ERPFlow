name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check deploy secrets
        env:
          API_HOOK: ${{ secrets.RENDER_API_DEPLOY_HOOK }}
          CLIENT_HOOK: ${{ secrets.RENDER_CLIENT_DEPLOY_HOOK }}
        run: |
          if [ -z "$API_HOOK" ]; then
            echo "Missing secret: RENDER_API_DEPLOY_HOOK"
            exit 1
          fi
          if [ -z "$CLIENT_HOOK" ]; then
            echo "Missing secret: RENDER_CLIENT_DEPLOY_HOOK"
            exit 1
          fi
          case "$API_HOOK" in
            https://api.render.com/deploy/*) ;;
            *)
              echo "RENDER_API_DEPLOY_HOOK must start with https://api.render.com/deploy/"
              exit 1
              ;;
          esac
          case "$CLIENT_HOOK" in
            https://api.render.com/deploy/*) ;;
            *)
              echo "RENDER_CLIENT_DEPLOY_HOOK must start with https://api.render.com/deploy/"
              exit 1
              ;;
          esac
          echo "Deploy secrets look valid."

      - name: Trigger Render API deploy
        env:
          API_HOOK: ${{ secrets.RENDER_API_DEPLOY_HOOK }}
        run: curl -fsS -X POST "$API_HOOK"

      - name: Trigger Render Client deploy
        env:
          CLIENT_HOOK: ${{ secrets.RENDER_CLIENT_DEPLOY_HOOK }}
        run: curl -fsS -X POST "$CLIENT_HOOK"
